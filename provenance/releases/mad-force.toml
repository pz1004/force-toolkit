[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mad-force-public"
version = "0.1.0"
description = "MAD-FORCE robust streaming correlation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "scikit-learn==1.8.0",
  "pandas==2.3.3",
  "numba==0.63.1",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "yfinance==1.2.0",
  "requests==2.32.3",
  "tqdm==4.67.1",
  "cloudpickle==3.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=no"
