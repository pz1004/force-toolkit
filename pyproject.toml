[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "force-toolkit"
version = "0.2.1"
authors = [{name = "Sooyoung Jang", email = "syjang@hanbat.ac.kr"}]
description = "FORCE family: accepted-pair correlations and calibrated transformed-scatter sketches"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "Licence.txt", "licenses/*.txt"]
dependencies = ["numpy>=2.0,<2.5", "numba>=0.65,<0.66"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/pz1004/force-toolkit"
Issues = "https://github.com/pz1004/force-toolkit/issues"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2", "scipy>=1.12"]
benchmark = ["psutil>=5.9", "threadpoolctl>=3"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["force_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
